services:
  postgres:
    image: postgres:17-alpine
    container_name: monorepo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  # Хранилище бинарников файлов встречи (apps/api, env UPLOADS_DIR).
  # Пока в compose нет сервиса `api` — том объявлен заранее; монтировать в
  # контейнер API (`/app/apps/api/uploads`) при его контейнеризации.
  # До тех пор API в dev пишет файлы в локальный каталог UPLOADS_DIR (по умолчанию ./uploads).
  uploads-data:
